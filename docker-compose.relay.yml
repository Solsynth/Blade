# Blade L4 relay node — the PoP side.
#
#   RELAY_CONFIG=./jp-01.toml RELAY_NAME=blade-relay-jp-01 \
#     docker compose -f docker-compose.relay.yml up -d
#
# The node terminates no TLS: it peeks the cleartext ClientHello, routes by SNI,
# and copies bytes to an origin. It needs egress only — to the gateway's public
# entry for registration and heartbeats (`discovery.url` in the relay config)
# and to its upstreams. It joins no gateway network and opens no inbound port
# beyond the one clients dial.
#
# Point RELAY_CONFIG at a copy of configs/relay-example.toml per PoP: `relay.id`
# must be unique, and `discovery.url` plus `discovery.registrationToken` must
# match the gateway. Everything below is overridable so several PoPs can run on
# one host.
name: ${RELAY_PROJECT:-blade-relay}

services:
  relay:
    image: blade-relay:latest
    # Drop `build` if you deploy the image CI publishes.
    build:
      context: .
      dockerfile: Dockerfile.relay
    container_name: ${RELAY_NAME:-blade-relay-jp-01}
    restart: unless-stopped
    environment:
      RELAY_CONFIG_PATH: /app/configs/relay.toml
      ZEROLOG_PRETTY: "false"
      LOG_LEVEL: info
    ports:
      # relay.listen — the only port facing the internet. The host side is yours
      # to choose; clients dial the address in relay.publicHost/publicPort.
      - "${RELAY_PORT:-443}:443"
      # health.listen — operators only. The gateway never dials it: relays live
      # outside its network and report their own health over discovery.url.
      - "127.0.0.1:${STATUS_PORT:-8081}:8081"
    volumes:
      # Holds discovery.registrationToken. Keep it 0600 and readable in here.
      - ${RELAY_CONFIG:-./configs/relay.toml}:/app/configs/relay.toml:ro
    healthcheck:
      # /status, not /health: /health reflects upstream reachability, which the
      # node reports to the catalog on its own. A PoP whose origin is briefly
      # down is still a healthy container.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    # SIGTERM stops accepting, cuts live connections, and withdraws the
    # registration within a 5 second budget.
    stop_grace_period: 5s
    # Only binding :443 inside the container needs this.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
