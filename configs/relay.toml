# Blade L4 relay node.
#
# Per-PoP file: copy it per node (docker-compose.relay.yml mounts it via
# RELAY_CONFIG and the binary reads it via RELAY_CONFIG_PATH). Only relay.id,
# the public host/port, and the region differ between PoPs.
#
# TLS is never terminated here: the relay peeks the cleartext TLS ClientHello,
# matches the SNI against the allowlist below, and copies bytes to the origin,
# so certificates and end-to-end encryption stay between client and origin.

[relay]
listen = ":443"
# Instance id in the catalog; must be unique per relay service.
id = "jp-01"
# Address clients dial and the catalog publishes.
publicHost = "relay-jp.solian.app"
publicPort = 443
region = "jp"
# weight = 1               # client-side preference among relays
# maxConnections = 0       # 0 is unlimited
# dialTimeout = "5s"       # budget for reaching an origin
# idleTimeout = "0s"       # 0 disables; otherwise drop silent connections
# sniTimeout = "5s"        # budget for reading the ClientHello
# maxClientHelloBytes = 8192
# defaultUpstream = ""     # empty means: reject every SNI not listed below

# The allowlist is the only routing input. Targets need an explicit port, and
# must not point back at this relay's own public address (that would loop).
[[relay.upstreams]]
sni = "api.solian.app"
target = "api.solian.app:443"

[[relay.upstreams]]
sni = "relay-jp.solian.app"
target = "api.solian.app:443"

# Registration runs over the gateway's public HTTPS entry, so this node needs
# no cluster-network access and no inbound port beyond relay.listen. The
# gateway owns the service name, lease, and instance path.
[discovery]
enabled = true
url = "https://api.solian.app"
registrationToken = "replace-with-a-service-secret"
