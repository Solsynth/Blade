# Blade L4 relay node — example configuration.
#
# Copy to relay.toml on the node (or mount it and point RELAY_CONFIG_PATH at
# it). Every value marked CHANGE must be replaced before deploying.
#
# The relay terminates no TLS: it peeks the cleartext ClientHello, matches the
# SNI against the allowlist below, and copies bytes verbatim to the origin, so
# certificates and client certificates stay end-to-end. Routing inputs are
# exactly these upstream rules plus an optional default; no wildcards, SNI
# compared case-insensitively with trailing dots ignored.

[relay]
# CHANGE: friends are `:8443` + a port forward if you cannot bind :443.
listen = ":443"

# CHANGE: unique per service; in containers the hostname default is the
# container id, so set it explicitly or replicas overwrite each other.
id = "jp-01"

# CHANGE: the hostname and port clients dial.
publicHost = "relay-jp.example.com"
publicPort = 443

# Clients use region + weight to pick between nodes.
region = "jp"
weight = 1

# In-flight cap. Size from cost per connection (~2 goroutines + 32 KiB copy
# buffer per direction); 0 is unlimited.
maxConnections = 4096

# Peek budget, origin dial budget, and idle deadline (0 disables it).
sniTimeout = "5s"
dialTimeout = "5s"
idleTimeout = "0s"
maxClientHelloBytes = 8192

# Catch-all. Left empty on purpose: an SNI with no rule below is rejected.
# defaultUpstream = "10.0.0.10:443"

# Allowlist. `target` needs an explicit port; a target must not resolve back
# to this relay's own public address, or traffic loops through the relay.
[[relay.upstreams]]
sni = "api.example.com"
target = "10.0.0.10:443"

[[relay.upstreams]]
sni = "relay-jp.example.com"
target = "10.0.0.10:443"

[health]
# Operator surface only: GET /health dials the upstreams, GET /status reports
# counters. The gateway does not dial this — relays live outside the cluster
# network — so keep it off the public internet.
listen = ":8081"

[discovery]
# Announce this node so clients see it via GET /relays. When false the node
# still serves traffic but is never listed.
enabled = true

# CHANGE: the gateway's public entry. Registration, heartbeats, and the
# withdrawal on shutdown are HTTPS calls to <url>/relays/<id>, so this node
# needs no cluster-network access and no inbound port beyond relay.listen.
url = "https://api.example.com"

# Only for self-signed fleets.
tlsSkipVerify = false

# CHANGE: must match Blade's discovery.registrationToken. Sent as
# `authorization: Bearer <token>`; keep the file mode 0600.
registrationToken = "replace-with-a-service-secret"

[log]
# false in containers (JSON logs); ZEROLOG_PRETTY=true forces console output.
pretty = false
